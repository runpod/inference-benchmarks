[project]
name = "sls-bench"
version = "0.1.0"
description = "SQLite-backed Runpod Pod inference benchmarks"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "pydantic>=2.12,<3", "typer>=0.19,<1", "rich>=14,<15", "Pillow==13.0.0"]

[project.scripts]
bench = "sls_bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sls_bench"]

[tool.hatch.build.targets.sdist]
include = ["sls_bench/", "tests/", "pyproject.toml", "uv.lock", "README.md"]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
